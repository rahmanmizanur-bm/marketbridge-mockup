<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MarketBridge - full mockup (sample data)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --primary:#4f6af5; --primary-soft:#eef2ff; --bg:#f6f7fb; --card:#fff; --border:#e6e8ee;
      --fg:#0f172a; --muted:#f1f5f9; --muted-fg:#64748b; --emerald:#10b981; --emerald-soft:#ecfdf5;
      --red:#ef4444; --red-soft:#fef2f2; --amber:#d97706; --amber-soft:#fffbeb; --violet:#8b5cf6;
      --violet-soft:#f5f3ff; --sky:#0ea5e9; --sky-soft:#f0f9ff; --indigo-soft:#eef2ff; --slate:#94a3b8;
      --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.04);
      --font:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,sans-serif; --radius:14px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{font-family:var(--font);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
    .app{display:flex;min-height:100vh}
    a{color:inherit;text-decoration:none}

    /* sidebar */
    .sidebar{width:248px;flex-shrink:0;background:#0f1629;color:#cbd5e1;display:flex;flex-direction:column;padding:18px 14px;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
    .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
    .brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4f6af5,#8b5cf6);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
    .brand .name{color:#fff;font-weight:700;font-size:15px;letter-spacing:-.01em}
    .brand .name small{display:block;color:#64748b;font-weight:500;font-size:11px}
    .nav-label{color:#475569;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:14px 8px 6px}
    .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:#94a3b8;font-weight:500;font-size:13.5px;cursor:pointer;transition:background .15s,color .15s}
    .nav-item svg{width:17px;height:17px;opacity:.9}
    .nav-item:hover{background:rgba(255,255,255,.04);color:#e2e8f0}
    .nav-item.active{background:var(--primary);color:#fff}
    .sidebar .spacer{flex:1}
    .user{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid rgba(255,255,255,.06);margin-top:8px}
    .user .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#4f6af5);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
    .user .who{font-size:12.5px;color:#e2e8f0;font-weight:600}
    .user .who small{display:block;color:#64748b;font-weight:500}

    /* main */
    .main{flex:1;min-width:0;display:flex;flex-direction:column}
    .content{padding:26px 30px 56px;max-width:1300px;width:100%;margin:0 auto}
    .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
    .page-head h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.02em}
    .page-head p{margin:3px 0 0;color:var(--muted-fg);font-size:13px}
    .range{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--border);border-radius:10px;background:var(--card);font-weight:600;font-size:13px;box-shadow:var(--shadow)}
    .range svg{width:15px;height:15px;color:var(--muted-fg)}

    /* blocks */
    .block{margin-bottom:22px}
    .kpis{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}
    .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
    .kpi .k-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-fg)}
    .kpi .k-value{font-size:25px;font-weight:800;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
    .kpi .k-delta{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;font-weight:600;color:var(--muted-fg)}
    .k-delta.positive{color:var(--emerald)} .k-delta.negative{color:var(--red)}
    .k-delta svg{width:13px;height:13px}

    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
    .card-pad{padding:18px 20px}
    .card-head{padding:16px 20px;border-bottom:1px solid var(--border)}
    .card-head.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .card-head h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
    .card-head p{margin:3px 0 0;font-size:12px;color:var(--muted-fg)}
    .card-note{font-size:12.5px;color:var(--muted-fg);margin:4px 20px 0}

    .cols{display:grid;gap:20px}
    .cols.r2-1{grid-template-columns:2fr 1fr} .cols.r1-2{grid-template-columns:1fr 2fr} .cols.r1-1{grid-template-columns:1fr 1fr}
    .stack>*+*{margin-top:20px}

    .legend{display:flex;flex-wrap:wrap;gap:14px;padding:2px 2px 12px}
    .legend .li{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted-fg);font-weight:600}
    .legend .dot{width:9px;height:9px;border-radius:3px}
    .chart-svg{width:100%;height:auto;display:block}
    .donut-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
    .donut-legend{width:100%;display:flex;flex-direction:column;gap:7px}
    .donut-legend .row{display:flex;align-items:center;justify-content:space-between;font-size:13px}
    .donut-legend .row .l{display:inline-flex;align-items:center;gap:8px}
    .donut-legend .row .l .dot{width:10px;height:10px;border-radius:50%}
    .donut-legend .row .v{color:var(--muted-fg);font-variant-numeric:tabular-nums}

    .tiles{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}
    .tile{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:15px 16px;box-shadow:var(--shadow)}
    .tile .t-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-fg)}
    .tile .t-value{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
    .tile .t-sub{font-size:12px;color:var(--muted-fg);margin-top:3px}
    .section-title{font-size:15px;font-weight:700;letter-spacing:-.01em;margin:2px 0 12px}
    .tone-pos{color:var(--emerald)!important} .tone-neg{color:var(--red)!important}

    table{width:100%;border-collapse:collapse}
    thead th{text-align:left;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-fg);padding:11px 18px;border-bottom:1px solid var(--border);white-space:nowrap}
    thead th.r,tbody td.r{text-align:right}
    tbody td{padding:12px 18px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
    tbody tr:last-child td{border-bottom:0}
    tbody tr.clickable{cursor:pointer}
    tbody tr:hover{background:#fafbff}
    .num{font-variant-numeric:tabular-nums}
    .strong{font-weight:600;color:var(--fg)}
    .link{color:var(--primary);font-weight:600}
    .muted{color:var(--muted-fg)} .xs{font-size:12px}
    .cell-name{display:flex;align-items:center;gap:9px}
    .cell-name .av{width:26px;height:26px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-size:10.5px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
    .cell-sub{font-size:11.5px;color:var(--muted-fg);margin-top:1px}

    .badge{display:inline-flex;align-items:center;border-radius:6px;padding:2px 8px;font-size:10.5px;font-weight:700;white-space:nowrap;text-transform:capitalize}
    .b-green{background:var(--emerald-soft);color:#047857} .b-amber{background:var(--amber-soft);color:#b45309}
    .b-red{background:var(--red-soft);color:#b91c1c} .b-slate{background:var(--muted);color:var(--muted-fg)}
    .b-indigo{background:var(--indigo-soft);color:#4338ca} .b-violet{background:var(--violet-soft);color:#6d28d9}
    .b-sky{background:var(--sky-soft);color:#0369a1}

    .bar-rows{display:flex;flex-direction:column;gap:13px}
    .bar .bar-top{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin-bottom:6px;gap:12px}
    .bar .track{height:9px;background:var(--muted);border-radius:999px;overflow:hidden}
    .bar .fill{height:100%;border-radius:999px;background:var(--primary)}
    .bar .fill.green{background:var(--emerald)} .bar .fill.red{background:var(--red)} .bar .fill.amber{background:var(--amber)} .bar .fill.grey{background:var(--slate)}
    .bar .note{font-size:11.5px;margin-top:5px;color:var(--muted-fg)}
    .bar .note.pos{color:var(--emerald)} .bar .note.neg{color:var(--red)}

    .funnel-grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
    .funnel-foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
    .pill{border-radius:9px;padding:7px 12px;font-size:12.5px}
    .pill.rate{background:var(--muted)} .pill.rate b{color:var(--primary);margin-left:5px}
    .pill.drop{background:var(--red-soft);color:var(--red);font-weight:600}

    .ctrows{display:flex;flex-direction:column;gap:9px}
    .ctrow{display:flex;align-items:baseline;justify-content:space-between;gap:14px;font-size:13px}
    .ctrow .l{color:var(--muted-fg)} .ctrow .v{font-weight:600;text-align:right}
    .ctline{font-size:13px;color:var(--fg);padding:2px 0}

    .timeline{position:relative;padding-left:22px}
    .timeline:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--border)}
    .tl-item{position:relative;padding:0 0 18px}
    .tl-item:last-child{padding-bottom:0}
    .tl-item:before{content:"";position:absolute;left:-19px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary-soft)}
    .tl-time{font-size:11px;color:var(--muted-fg);font-weight:600}
    .tl-title{font-size:13.5px;font-weight:600;margin-top:2px}
    .tl-desc{font-size:12.5px;color:var(--muted-fg);margin-top:2px}
    .tl-kind{margin-top:4px}

    .detail-head{margin-bottom:20px}
    .back{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted-fg);font-weight:600;cursor:pointer;margin-bottom:12px}
    .back:hover{color:var(--primary)}
    .dh-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
    .dh-meta{display:flex;flex-wrap:wrap;gap:8px}
    .chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 11px;font-size:12.5px;box-shadow:var(--shadow)}
    .chip b{font-weight:700}

    .subtabs{display:flex;gap:4px;padding:4px;background:var(--muted);border-radius:12px;margin-bottom:22px;width:fit-content;flex-wrap:wrap}
    .subtab{appearance:none;border:0;background:transparent;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted-fg);padding:8px 16px;border-radius:9px;cursor:pointer;transition:all .15s}
    .subtab:hover{color:var(--fg)}
    .subtab.active{background:var(--card);color:var(--primary);box-shadow:var(--shadow)}
    .subpanel{display:none;animation:fadeUp .35s ease both} .subpanel.active{display:block}

    .toggle-rows{display:flex;flex-direction:column}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border)}
    .toggle-row:last-child{border-bottom:0}
    .switch{width:38px;height:22px;border-radius:999px;background:var(--muted);position:relative;transition:background .15s;flex-shrink:0}
    .switch.on{background:var(--primary)}
    .switch:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
    .switch.on:after{left:18px}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .fchip{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:5px 13px;font-size:12.5px;color:var(--muted-fg);font-weight:600}
    .fchip.active{background:var(--primary-soft);color:var(--primary);border-color:transparent}

    .search{height:36px;width:230px;border:1px solid var(--border);border-radius:9px;padding:0 12px;font-family:inherit;font-size:13px;outline:none}
    .search:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,106,245,.12)}
    .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}

    .page{animation:fadeUp .4s ease both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .badge-mock{position:fixed;right:16px;bottom:16px;background:#0f1629;color:#fbbf24;font-size:11px;font-weight:700;letter-spacing:.04em;padding:7px 13px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.2);z-index:50}

    @media (max-width:1024px){ .cols.r2-1,.cols.r1-2,.cols.r1-1{grid-template-columns:1fr} }
    @media (max-width:820px){
      .sidebar{display:none} .content{padding:20px 16px 44px}
      .table-scroll{overflow-x:auto} table{min-width:640px}
    }
  </style>
</head>
<body>

    <aside class="sidebar" id="sidebar"></aside>
    <div class="main"><div class="content" id="content"></div></div>
  </div>
  <div class="badge-mock">MOCKUP - sample data</div>

  "/subscribers/:id": { h1:"Tom Bradley", subtitle:"tom@bradleybuild.com.au - Enterprise - Subscriber since Jun 2024", back:"/subscribers", blocks:[
    { type:"detailHeader", badges:[{text:"active",tone:"green"},{text:"Healthy",tone:"green"}],
      meta:[{label:"Email",value:"tom@bradleybuild.com.au"},{label:"Package",value:"Enterprise"},{label:"Since",value:"Jun 2024"}] },

      { label:"Seats", value:"4 / 10", delta:"40% used" } ]},
    { type:"columns", ratio:"2-1", cols:[
      [ { type:"cardText", title:"Subscription", lines:[
            "Product: RenoLogic Subscription","Package: Enterprise","Billing period: Monthly","MRR: $350.00","Next renewal: 15 May 2026","Currency: AUD","Seats: 4 / 10 used (40%)" ] },
        { type:"cardText", title:"Contract & Deal", subtitle:"Enterprise", lines:[
            "Contract value: $4,200.00","Deal stage: Pending Confirmation","Contract start: 1 Jun 2024","Contract end: 31 May 2027","Account owner: Sales - RenoLogic","Pro-forma invoice: Pending (managed in Exsited - read-only)" ] },
        { type:"table", title:"Charges",

  /* ============================ helpers ============================ */
  const esc = (s) => String(s==null?"":s).replace(/[·—–]/g,"-").replace(/[""]/g,'"').replace(/['']/g,"'").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const ARROW = (d)=> d==="down" ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m18 15-6-6-6 6"/></svg>';
  let uid = 0;

  function toneClass(t){
    t = String(t||"").toLowerCase();
    if (["green","success","positive","released","verified","settled","paid"].includes(t)) return "b-green";
    if (["amber","warning","held","pending","flagged","trial","dunning","scheduled","sending"].includes(t)) return "b-amber";
    if (["red","danger","negative","failed","withheld","overdue","suspended","bounced"].includes(t)) return "b-red";
    if (["indigo","order"].includes(t)) return "b-indigo";
    if (["violet","event"].includes(t)) return "b-violet";
    if (["sky","view"].includes(t)) return "b-sky";
    return "b-slate";
  }
  function fillClass(t){
    t = String(t||"").toLowerCase();
    if (["green","success","positive"].includes(t)) return "green";
    if (["red","danger","negative"].includes(t)) return "red";
    if (["amber","warning"].includes(t)) return "amber";
    if (["grey","gray","slate","default","muted"].includes(t)) return "grey";
    return "";
  }

  function lineChart(cfg, height){
    height = height || 300;
    const W=820,H=height,padL=44,padR=14,padT=14,padB=28,plotW=W-padL-padR,plotH=H-padT-padB;
    const all=cfg.series.flatMap(s=>s.data); let max=Math.max(...all,1);
    const step=Math.pow(10,Math.floor(Math.log10(max))); max=Math.ceil(max/step)*step;
    const n=cfg.xAxis.length;
    const x=i=>padL+(n===1?plotW/2:(i*plotW)/(n-1));
    const y=v=>padT+plotH-(v/max)*plotH;
    let svg=`<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
    for(let g=0;g<=4;g++){ const gv=(max/4)*g, gy=y(gv);
      svg+=`<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="#eef1f6" stroke-width="1"/>`;
      svg+=`<text x="${padL-8}" y="${gy+4}" text-anchor="end" font-size="11" fill="#94a3b8">${gv>=1000?(gv/1000)+"k":gv}</text>`; }
    cfg.xAxis.forEach((lbl,i)=>{ svg+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#94a3b8">${esc(lbl)}</text>`; });
    const s0=cfg.series[0]; let area=`M ${x(0)} ${y(s0.data[0])}`;
    s0.data.forEach((v,i)=>{ if(i) area+=` L ${x(i)} ${y(v)}`; });
    area+=` L ${x(n-1)} ${padT+plotH} L ${x(0)} ${padT+plotH} Z`;
    const gid="g"+(++uid);
    svg+=`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${s0.color}" stop-opacity="0.18"/><stop offset="100%" stop-color="${s0.color}" stop-opacity="0"/></linearGradient></defs>`;
    svg+=`<path d="${area}" fill="url(#${gid})"/>`;
    cfg.series.forEach(s=>{ let d=""; s.data.forEach((v,i)=>{ d+=(i?" L ":"M ")+x(i)+" "+y(v); });
      svg+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
      s.data.forEach((v,i)=>{ svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="#fff" stroke="${s.color}" stroke-width="2"/>`; }); });
    svg+=`</svg>`;
    const legend=`<div class="legend">${cfg.series.map(s=>`<span class="li"><span class="dot" style="background:${s.color}"></span>${esc(s.name)}</span>`).join("")}</div>`;
    return legend+svg;
  }
  function donut(b){
    const slices=b.slices||[], r=60,cx=80,cy=80,sw=22,C=2*Math.PI*r;
    const total=slices.reduce((a,s)=>a+(+s.value||0),0)||1; let off=0,arcs="";
    slices.forEach(s=>{ const len=((+s.value||0)/total)*C;
      arcs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`; off+=len; });
    const svg=`<svg viewBox="0 0 160 160" width="160" height="160">${arcs}<text x="80" y="74" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="600">${esc(b.centerTitle||"")}</text><text x="80" y="94" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="800">${esc(b.centerValue||"")}</text></svg>`;
    const legend=`<div class="donut-legend">${slices.map(s=>`<div class="row"><span class="l"><span class="dot" style="background:${s.color}"></span>${esc(s.label)}</span><span class="v">${esc(s.display)}</span></div>`).join("")}</div>`;
    return `<div class="donut-wrap">${svg}${legend}</div>`;
  }

  function cardHead(title, subtitle, extra){
    if(!title && !subtitle) return "";
    return `<div class="card-head${extra?" row":""}"><div><h3>${esc(title||"")}</h3>${subtitle?`<p>${esc(subtitle)}</p>`:""}</div>${extra||""}</div>`;
  }

  function nameCell(val, row){
    if(row && row.initials){
      return `<div class="cell-name"><span class="av">${esc(row.initials)}</span><span>${esc(val)}</span></div>`;
    }
    if(row && row.trigger){
      return `<div><div class="strong">${esc(val)}</div><div class="cell-sub">Trigger: ${esc(row.trigger)}</div></div>`;
    }
    const parts=String(val).split(/\s{2,}/);
    if(parts.length>1){
      return `<div><div class="strong">${esc(parts[0])}</div><div class="cell-sub">${esc(parts.slice(1).join(" "))}</div></div>`;
    }
    return `<span class="strong">${esc(val)}</span>`;
  }

  function renderTable(b){
    const search = b.search ? `<input class="search" oninput="filterTable(this)" placeholder="Search...">` : "";
    const head = cardHead(b.title, b.subtitle, search || (b.title?"":undefined));
    const cols = b.columns||[];
    const ths = cols.map(c=>`<th class="${c.align==="right"?"r":""}">${esc(c.label)}</th>`).join("");
    const rowClick = b.rowLink ? ` class="clickable" onclick="nav('${b.rowLink}')"` : "";
    const trs = (b.rows||[]).map(row=>{
      const tds = cols.map(c=>{
        let v = row[c.key];
        const isName = ["name","subscriber","recipient","account","contractor"].includes(c.key);
        if(b.badges && b.badges.col===c.key){
          return `<td><span class="badge ${toneClass((b.badges.map||{})[v]||v)}">${esc(v)}</span></td>`;
        }
        if(isName) return `<td>${nameCell(v,row)}</td>`;
        return `<td class="${c.align==="right"?"r num":""}">${esc(v)}</td>`;
      }).join("");
      return `<tr${rowClick}>${tds}</tr>`;
    }).join("");
    return `<div class="card">${head}<div class="table-scroll"><table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div></div>`;
  }

  function renderKpis(b){
    return `<div class="kpis">${b.items.map(k=>{
      const delta = k.delta ? `<div class="k-delta ${k.tone||""}">${k.dir?ARROW(k.dir):""}${esc(k.delta)}</div>` : "";
      return `<div class="kpi"><div class="k-label">${esc(k.label)}</div><div class="k-value">${esc(k.value)}</div>${delta}</div>`;
    }).join("")}</div>`;
  }
  function renderTiles(b){
    const title = b.title?`<h3 class="section-title">${esc(b.title)}</h3>`:"";
    return `${title}<div class="tiles">${b.items.map(t=>{
      const tonec = t.tone==="positive"?"tone-pos":t.tone==="negative"?"tone-neg":"";
      return `<div class="tile"><div class="t-label">${esc(t.label)}</div><div class="t-value">${esc(t.value)}</div>${t.sub?`<div class="t-sub ${tonec}">${esc(t.sub)}</div>`:""}</div>`;
    }).join("")}</div>`;
  }
  function renderBarList(b){
    const note = b.note?`<div class="card-note">${esc(b.note)}</div>`:"";
    const rows = (b.rows||[]).map(r=>{
      const fc = fillClass(r.tone);
      const track = r.pct ? `<div class="track"><div class="fill ${fc}" style="width:${Math.max(Math.min(r.pct,100),2)}%"></div></div>` : "";
      const notec = r.tone && ["green","success","positive"].includes(String(r.tone).toLowerCase()) ? "pos" : (r.tone && ["red","danger","negative"].includes(String(r.tone).toLowerCase()) ? "neg" : "");
      const nt = r.note?`<div class="note ${notec}">${esc(r.note)}</div>`:"";
      return `<div class="bar"><div class="bar-top"><span class="strong">${esc(r.label)}</span><span class="muted num">${esc(r.value)}</span></div>${track}${nt}</div>`;
    }).join("");
    return `<div class="card">${cardHead(b.title,b.subtitle)}${note}<div class="card-pad"><div class="bar-rows">${rows}</div></div></div>`;
  }
  function renderCardText(b){
    const body = (b.lines||[]).map(l=>{
      const i = String(l).indexOf(": ");
      if(i>0 && i<40) return `<div class="ctrow"><span class="l">${esc(l.slice(0,i))}</span><span class="v">${esc(l.slice(i+2))}</span></div>`;
      return `<div class="ctline">${esc(l)}</div>`;
    }).join("");
    return `<div class="card">${cardHead(b.title,b.subtitle)}<div class="card-pad"><div class="ctrows">${body}</div></div></div>`;
  }
  function renderTimeline(b){
    const items=(b.items||[]).map(it=>`<div class="tl-item"><div class="tl-time">${esc(it.time)}</div><div class="tl-title">${esc(it.title)}</div>${it.desc?`<div class="tl-desc">${esc(it.desc)}</div>`:""}${it.kind?`<div class="tl-kind"><span class="badge ${toneClass(it.kind)}">${esc(it.kind)}</span></div>`:""}</div>`).join("");
    return `<div class="card">${cardHead(b.title,b.subtitle)}<div class="card-pad"><div class="timeline">${items}</div></div></div>`;
  }
  function renderFunnel(b){
    const cards=(b.cards||[]).map(f=>{
      const steps=f.steps.map(s=>`<div class="bar"><div class="bar-top"><span class="strong">${esc(s.label)}</span><span class="muted num">${(+s.count).toLocaleString()} (${s.pct}%)</span></div><div class="track"><div class="fill ${s.isFinal?"green":""}" style="width:${Math.max(s.pct,2)}%"></div></div>${s.dropNote?`<div class="note neg">${esc(s.dropNote)}</div>`:""}</div>`).join("");
      return `<div class="card card-pad"><h3 style="margin:0;font-size:15px;font-weight:700">${esc(f.title)}</h3>${f.subtitle?`<p class="muted" style="margin:3px 0 16px;font-size:12px">${esc(f.subtitle)}</p>`:""}<div class="bar-rows">${steps}</div><div class="funnel-foot"><span class="pill rate">Overall rate <b>${esc(f.overallRate)}</b></span><span class="pill drop">Biggest drop-off: ${esc(f.biggestDropoff)}</span></div></div>`;
    }).join("");
    return `<div class="funnel-grid">${cards}</div>`;
  }
  function renderDetailHeader(b){
    const back = window.__back ? `<div class="back" onclick="nav('${window.__back}')">&larr; Back</div>` : "";
    const badges = (b.badges||[]).map(x=>`<span class="badge ${toneClass(x.tone)}">${esc(x.text)}</span>`).join("");
    const meta = (b.meta||[]).map(m=>`<span class="chip"><span class="muted">${esc(m.label)}</span> <b>${esc(m.value)}</b></span>`).join("");
    return `<div class="detail-head">${back}${badges?`<div class="dh-badges">${badges}</div>`:""}${meta?`<div class="dh-meta">${meta}</div>`:""}</div>`;
  }
  function renderToggle(b){
    const rows=(b.items||[]).map(it=>`<div class="toggle-row"><span class="strong">${esc(it.label)}</span><span class="switch ${it.on?"on":""}" onclick="this.classList.toggle('on')"></span></div>`).join("");
    return `<div class="card">${cardHead(b.title,b.subtitle)}<div class="card-pad"><div class="toggle-rows">${rows}</div></div></div>`;
  }
  function renderChips(b){
    return `<div class="block chips">${(b.items||[]).map((c,i)=>`<span class="fchip ${i===0?"active":""}">${esc(c)}</span>`).join("")}</div>`;
  }
  function renderTabsBlock(b){
    const gid="tg"+(++uid);
    const btns=b.tabs.map((t,i)=>`<button class="subtab ${i===0?"active":""}" data-g="${gid}" data-v="${t.value}" onclick="switchSub('${gid}','${t.value}')">${esc(t.label)}</button>`).join("");
    const panels=b.tabs.map((t,i)=>`<div class="subpanel ${i===0?"active":""}" data-g="${gid}" data-v="${t.value}">${renderBlocks(b.panels[t.value]||[])}</div>`).join("");
    return `<div class="subtabs">${btns}</div>${panels}`;
  }
  function renderColumns(b){
    const cls = b.ratio==="1-2"?"r1-2":b.ratio==="1-1"?"r1-1":"r2-1";
    return `<div class="cols ${cls}">${b.cols.map(col=>`<div class="stack">${renderBlocks(col)}</div>`).join("")}</div>`;
  }

  function renderBlock(b){
    switch(b.type){
      case "kpis": return renderKpis(b);
      case "lineChart": return `<div class="card">${cardHead(b.title,b.subtitle)}<div class="card-pad">${lineChart(b,300)}</div></div>`;
      case "donut": return `<div class="card">${cardHead(b.title,b.subtitle)}<div class="card-pad">${donut(b)}</div></div>`;
      case "barList": return renderBarList(b);
      case "table": return renderTable(b);
      case "tiles": return renderTiles(b);
      case "cardText": return renderCardText(b);
      case "timeline": return renderTimeline(b);
      case "funnel": return renderFunnel(b);
      case "detailHeader": return renderDetailHeader(b);
      case "toggleList": return renderToggle(b);
      case "chips": return renderChips(b);
      case "tabs": return renderTabsBlock(b);
      case "columns": return renderColumns(b);
      default: return "";
    }
  }
  function renderBlocks(blocks){ return (blocks||[]).map(b=>`<div class="block">${renderBlock(b)}</div>`).join(""); }

  /* ============================ router + shell ============================ */
  function resolve(path){
    if(PAGES[path]) return path;
    if(/^\/subscribers\/[^/]+$/.test(path)) return "/subscribers/:id";
    if(/^\/campaigns\/[^/]+$/.test(path)) return "/campaigns/:id";
    if(/^\/flows\/[^/]+$/.test(path)) return "/flows/:id";
    return "/";
  }
  function parentOf(key){
    if(key==="/subscribers/:id") return "/subscribers";
    if(key==="/campaigns/:id") return "/campaigns";
    if(key==="/flows/:id") return "/campaigns";
    return key;
  }
  function nav(path){ location.hash = "#"+path; }
  window.nav = nav;
  window.switchSub = function(gid,v){
    document.querySelectorAll(`.subtab[data-g="${gid}"]`).forEach(b=>b.classList.toggle("active", b.dataset.v===v));
    document.querySelectorAll(`.subpanel[data-g="${gid}"]`).forEach(p=>p.classList.toggle("active", p.dataset.v===v));
  };
  window.filterTable = function(input){
    const card=input.closest(".card"), q=input.value.trim().toLowerCase();
    card.querySelectorAll("tbody tr").forEach(tr=>{ tr.style.display = tr.textContent.toLowerCase().includes(q)?"":"none"; });
  };

  function renderSidebar(activeParent){
    const groups = NAV.map(g=>`<div class="nav-label">${esc(g.heading)}</div>${g.items.map(it=>`<div class="nav-item ${it.path===activeParent?"active":""}" onclick="nav('${it.path}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${IC[it.icon]}</svg>${esc(it.label)}</div>`).join("")}`).join("");
    document.getElementById("sidebar").innerHTML =
      `<div class="brand"><div class="mark">M</div><div class="name">MarketBridge<small>RenoSafe growth</small></div></div>
       ${groups}
       <div class="spacer"></div>
       <div class="nav-item ${activeParent==="/settings"?"active":""}" onclick="nav('/settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${IC.gear}</svg>Settings</div>
       <div class="user"><div class="av">RM</div><div class="who">RenoSafe Ops<small>admin</small></div></div>`;
  }

  function render(){
    uid=0;
    const path=(location.hash||"#/").replace(/^#/,"")||"/";
    const key=resolve(path);
    const page=PAGES[key];
    window.__back = page.back || null;
    renderSidebar(parentOf(key));
    const toolbar = page.toolbar ? `<div class="toolbar">${page.toolbar.search?`<input class="search" oninput="filterToolbar(this)" placeholder="Search subscribers...">`:""}${(page.toolbar.filters||[]).map(f=>`<span class="fchip">${esc(f)}</span>`).join("")}</div>` : "";
    document.getElementById("content").innerHTML =
      `<div class="page"><div class="page-head"><div><h1>${esc(page.h1)}</h1><p>${esc(page.subtitle)}</p></div><div class="range">Last 30 days <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></div></div>${toolbar}${renderBlocks(page.blocks)}</div>`;
    window.scrollTo(0,0);
  }
  window.filterToolbar = function(input){
    const q=input.value.trim().toLowerCase();
    const table=document.querySelector(".content table");
    if(table) table.querySelectorAll("tbody tr").forEach(tr=>{ tr.style.display=tr.textContent.toLowerCase().includes(q)?"":"none"; });
  };

  window.addEventListener("hashchange", render);
  render();
  </script>
</body>
</html>
